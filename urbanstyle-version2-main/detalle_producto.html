<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrbanStyle - Detalle del Producto</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <nav class="nav-bar">
            <a href="index.html" class="brand-title">UrbanStyle</a>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Inicio</a></li>
                <li><a href="index.html#catalogo" class="nav-link">Catálogo</a></li>
                <li id="navLoginItem"><a href="login.html" class="nav-link">Iniciar Sesión</a></li>
                <li id="navRegisterItem"><a href="registro.html" class="btn-cta">Registrarse</a></li>
            </ul>
        </nav>
    </header>

    <main class="content-wrapper container my-5">
        <section class="product-detail-container" id="detalleProductoContainer">
            <div class="row g-4 align-items-start">
                
                <!-- Columna Izquierda: Imagen del Producto -->
                <div class="col-12 col-md-6">
                    <div class="detail-image-box text-center p-3 border rounded shadow-sm bg-white">
                        <img id="detailImg" src="imagen/imagen3.pgn.jpg" alt="Imagen del producto" class="img-fluid style-product-img">
                    </div>
                </div>

                <!-- Columna Derecha: Información del Producto -->
                <div class="col-12 col-md-6">
                    <div class="detail-info-box p-3">
                        <span class="text-uppercase text-muted fw-bold small">UrbanStyle</span>
                        <h2 id="detailTitle" class="section-heading-left mt-1 mb-2">Cargando...</h2>
                        
                        <div class="price-box my-3">
                            <span class="fs-2 fw-bold text-dark" id="detailPrice"></span>
                        </div>

                        <hr>

                        <div class="spec-item mb-3">
                            <strong>Calidad:</strong> <span id="detailQuality" class="badge bg-secondary ms-1"></span>
                        </div>

                        <div class="spec-item mb-3">
                            <label for="detailSize" class="form-label"><strong>Talla disponible:</strong></label>
                            <select id="detailSize" class="form-select w-50">
                                <option value="S">S</option>
                                <option value="M">M</option>
                                <option value="L">L</option>
                                <option value="XL">XL</option>
                            </select>
                        </div>

                        <div class="spec-item mb-3">
                            <strong>Descripción:</strong>
                            <p class="product-desc text-muted mt-1" id="detailDescription"></p>
                        </div>

                        <div class="quantity-box mb-4">
                            <label for="detailqty" class="form-label"><strong>Cantidad:</strong></label>
                            <input type="number" id="detailqty" value="1" min="1" class="form-control w-25">
                        </div>

                        <button class="btn btn-primary btn-lg w-100 fw-bold shadow-sm" id="btnAddToCart">
                            Añadir al Carrito
                        </button>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 tienda de ropa exclusiva UrbanStyle - Todos los derechos reservados.</p>
        <p>Escuela de Informática y Telecomunicaciones Duoc UC.</p>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="carrito.js"></script>
    <script src="app.js"></script>
</body>
</html>
