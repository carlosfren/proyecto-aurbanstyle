<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrbanStyle- Iniciar Sesión</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <nav class="nav-bar">
            <a href="index.html" class="brand-title">UrbanStyle</a>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Inicio</a></li>
                <li id="navRegisterItem"><a href="registro.html" class="btn-cta">Registrarse</a></li>
            </ul>
        </nav>
    </header>S

    <main class="content-wrapper">
        <section class="form-card">
            <h2 class="section-heading">Iniciar Sesión</h2>
            
            <form id="loginForm" novalidate>
                <div class="form-field">
                    <label for="loginCorreo">Correo Electrónico</label>
                    <input type="email" id="loginCorreo" name="loginCorreo" placeholder="usuario@correo.com">
                    <span class="error-text" id="errorLoginCorreo"></span>
                </div>

                <div class="form-field">
                    <label for="loginPassword">Contraseña</label>
                    <input type="password" id="loginPassword" name="loginPassword" placeholder="Tu contraseña">
                    <span class="error-text" id="errorLoginPassword"></span>
                </div>

                <button type="submit" class="btn-primary">Ingresar</button>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 tienda de ropa exclusiva UrbanStyle - Escuela de Informática y Telecomunicaciones Duoc UC.</p>
    </footer>

    <!-- 1. JavaScript de Bootstrap 5 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 2. Tu nuevo script del Carrito -->
    <script src="carrito.js"></script>

    <!-- 3. Tu script actual de la aplicación -->
    <script src="app.js"></script>

</body>
</html>
